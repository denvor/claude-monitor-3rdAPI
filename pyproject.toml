[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-monitor"
version = "1.0.0"
description = "Claude Code token usage monitor with custom pricing from monitor.ini"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
claude-monitor = "claude_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["claude_monitor*"]
